scan:
  name: "Scan NFC Tasg"
  description: >-
    Process a tag scan. Without an action, a single scan logs the default
    action after the double-scan window; a second scan within the window
    sends an action menu to the scanning device.
  fields:
    tag_id:
      name: "Tag ID"
      description: "UUID of the scanned NFC tag."
      required: true
      example: "00000000-0000-0000-0000-000000000001"
      selector:
        text: {}
    scanner_device_id:
      name: "Scanner Device ID"
      description: "HA device ID of the phone that scanned the tag."
      required: true
      example: "0123456789abcdef0123456789abcdef"
      selector:
        text: {}
    action:
      name: "Action"
      description: >-
        Action key. When set, the action is logged immediately (this is what
        the notification menu uses). When omitted, the double-scan window
        applies and the default action is logged.
      required: false
      example: "beans_refilled"
      selector:
        text: {}

log:
  name: "Log action manually"
  description: "Log an action without a tag scan."
  fields:
    device_id:
      name: "Device"
      description: "NFC Tasgs device to log the action against."
      required: true
      selector:
        device:
          integration: nfc_tasgs
    action_key:
      name: "Action Key"
      description: "Action key to log."
      required: true
      example: "cleaned"
      selector:
        text: {}
    scanner:
      name: "Scanner"
      description: "Name of the person who performed the action."
      required: true
      example: "Jon Doe"
      selector:
        text: {}

reset_action:
  name: "Reset action counters"
  description: "Reset a specific action's counters and history."
  fields:
    device_id:
      name: "Device"
      description: "NFC Tasgs device to reset."
      required: true
      selector:
        device:
          integration: nfc_tasgs
    action_key:
      name: "Action Key"
      description: "Action key to reset."
      required: true
      example: "cleaned"
      selector:
        text: {}

set_assignee:
  name: "Set assignee"
  description: "Change the assigned person for a device."
  fields:
    device_id:
      name: "Device"
      description: "NFC Tasgs device to update."
      required: true
      selector:
        device:
          integration: nfc_tasgs
    person:
      name: "Person"
      description: "Person entity ID, or empty string to clear."
      required: true
      example: "person.jon_doe"
      selector:
        text: {}

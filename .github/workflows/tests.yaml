name: Tests
on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest tests -q
